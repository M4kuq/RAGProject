name: Frontend CI

on:
  pull_request:
    paths:
      - "frontend/**"
      - "scripts/verify_frontend_security_integration.mjs"
      - "scripts/verify_rag31_frontend_security_integration.mjs"
      - "docs/security/frontend_security_*"
      - "docs/security/rag31_frontend_security_*"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "scripts/verify_frontend_security_integration.mjs"
      - "scripts/verify_rag31_frontend_security_integration.mjs"
      - "docs/security/frontend_security_*"
      - "docs/security/rag31_frontend_security_*"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: lint / typecheck / test / build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify canonical security integration
        working-directory: .
        run: node scripts/verify_frontend_security_integration.mjs

      - name: Verify RAG-31 and frontend canonical integration
        working-directory: .
        run: node scripts/verify_rag31_frontend_security_integration.mjs

      - name: Dependency audit policy negative controls
        run: npm run security:audit:test

      - name: Dependency audit regression gate
        run: npm run security:audit

      - name: Verify dependency tree
        run: npm run security:tree

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Route and auth tests (three repeats)
        run: |
          for repeat in 1 2 3; do
            echo "route_auth_repeat=${repeat}"
            npm exec -- vitest run \
              src/app/router.test.tsx \
              src/routes/LoginPage.test.tsx \
              src/routes/ChatPage.test.tsx \
              src/routes/admin/admin.test.tsx
          done

      - name: Unit tests (three repeats)
        run: |
          for repeat in 1 2 3; do
            echo "full_frontend_repeat=${repeat}"
            npm test
          done

      - name: Production build
        run: npm run build
