name: Repository Secret Scan

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks history / negative controls
    runs-on: ubuntu-latest
    env:
      GITLEAKS_IMAGE: >-
        ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    steps:
      - name: Checkout full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Pull digest-pinned Gitleaks 8.30.1
        run: docker pull "$GITLEAKS_IMAGE"

      - name: Validate exact-suppression policy
        run: python scripts/secret_scan_gate.py policy

      - name: Scan current tree and repository history
        run: >-
          python scripts/secret_scan_gate.py verify
          --docker-image "$GITLEAKS_IMAGE"
